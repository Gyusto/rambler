services:
  db:
    image: postgres:13
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - rambler-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # uncomment to inspect the DB from the host
    # ports:
    #   - "5432:5432"

  # S3-compatible object storage for uploaded images.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
    volumes:
      - rambler-minio:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

  server:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    # all values come from the .env file (see .env.example)
    environment:
      ConnectionStrings__DefaultConnection: "${CONNECTION_STRING}"
      Token__Secret: "${TOKEN_SECRET}"
      Token__ExpirationMinutes: "${TOKEN_EXPIRATION_MINUTES}"
      Site__AppUrl: "${SITE_APP_URL}"
      Site__CookieDomain: "${SITE_COOKIE_DOMAIN}"
      Site__CookieSameSite: "${SITE_COOKIE_SAMESITE}"
      Site__CookieSecure: "${SITE_COOKIE_SECURE}"
      Site__CookieIdentity: "${SITE_COOKIE_IDENTITY}"
      Site__EnableCaptcha: "${SITE_ENABLE_CAPTCHA}"
      Site__AutoConfirmEmail: "${SITE_AUTOCONFIRMEMAIL}"
      Site__LobbyOwner: "${SITE_LOBBY_OWNER}"
      Media__Endpoint: "${MEDIA_ENDPOINT}"
      Media__PublicUrl: "${MEDIA_PUBLIC_URL}"
      Media__AccessKey: "${MINIO_ROOT_USER}"
      Media__SecretKey: "${MINIO_ROOT_PASSWORD}"
      Media__Bucket: "${MEDIA_BUCKET}"
      Logging__LogLevel__Default: "${LOG_LEVEL}"
    ports:
      - "${APP_PORT}:5000"

  # New Next.js frontend (coexists with the legacy AngularJS client on the server).
  # Browser -> web-next (:5001) for the UI; /api is proxied to the .NET server,
  # and the WebSocket connects straight to the server on :5000.
  web-next:
    build:
      context: ./Rambler.Web.Next
      dockerfile: Dockerfile
      args:
        # inlined into the client bundle at build time (browser-reachable ws)
        NEXT_PUBLIC_WS_URL: "${NEXT_PUBLIC_WS_URL}"
    depends_on:
      - server
    environment:
      # server-side proxy target for /api rewrites (Docker network)
      BACKEND_URL: "http://server:5000"
    ports:
      - "${WEB_NEXT_PORT}:5001"

volumes:
  rambler-db:
  rambler-minio:
